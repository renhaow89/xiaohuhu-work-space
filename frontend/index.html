<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xiaohuhu Work Space</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<h1>Xiaohuhu Work Space</h1>

<nav class="workspace-nav">
  <a href="#journal-panel">📝 记录</a>
  <a href="#task-panel">📌 任务</a>
  <a href="#research-panel">🧪 科研</a>
  <a href="#reading-panel">📚 阅读</a>
  <a href="#file-panel">📁 文件</a>
  <a href="#settings-panel">⚙️ 设置</a>
</nav>

<div class="workspace-grid">
  <section class="panel" id="journal-panel">
    <h2>📝 今日记录</h2>
  </section>

  <section class="panel" id="task-panel">
    <h2>📌 今日任务</h2>
  </section>

  <section class="panel" id="research-panel">
    <h2>🧪 科研记录</h2>
  </section>

  <section class="panel" id="reading-panel">
    <h2>📚 阅读中心</h2>
  </section>

  <section class="panel" id="file-panel">
    <h2>📁 文件中心</h2>
  </section>

  <section class="panel" id="settings-panel">
    <h2>⚙️ 设置中心</h2>
  </section>
</div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
