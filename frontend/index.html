<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xiaohuhu Work Space - 个人数字工作空间</title>
  
  <!-- PWA Web App Manifest & Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F4738A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="小呼呼">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">

  <link rel="stylesheet" href="style.css?v=1.3.4">
</head>
<body>
<div id="app">
  <!-- 左侧固定侧边栏 (110px 桌面端 / 62px 移动端紧凑手账侧边栏) -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand" id="brand-home" title="Xiaohuhu Work Space">
      <span class="brand-icon">🌸</span>
      <span class="brand-title">小呼呼</span>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" data-panel="task-panel" title="任务管理">
        <span class="nav-icon">📌</span>
        <span class="nav-label">任务</span>
      </button>
      <button class="nav-item" data-panel="journal-panel" title="工作日志">
        <span class="nav-icon">📝</span>
        <span class="nav-label">日志</span>
      </button>
      <button class="nav-item" data-panel="reading-panel" title="文献阅读">
        <span class="nav-icon">📚</span>
        <span class="nav-label">阅读</span>
      </button>
      <button class="nav-item" data-panel="research-panel" title="科研记录">
        <span class="nav-icon">🧪</span>
        <span class="nav-label">科研</span>
      </button>
      <button class="nav-item" data-panel="file-panel" title="文件中心">
        <span class="nav-icon">📁</span>
        <span class="nav-label">文件</span>
      </button>
      <button class="nav-item" data-panel="settings-panel" title="设置中心">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">设置</span>
      </button>
    </nav>
  </aside>

  <!-- 右侧单面板主内容区 -->
  <main class="main-content">
    <!-- 顶部 Header：显示当前面板标题 + 动态中文日期 + 导出/导入快捷按钮 + 清理缓存更新 -->
    <header class="header-container">
      <div class="header-left">
        <h1 id="current-panel-title">📌 任务管理</h1>
      </div>

      <div class="header-right">
        <div class="header-date" id="current-date">2026年8月27日 星期四</div>
        <div class="header-actions">
          <button id="header-clear-cache-btn" class="btn btn-secondary btn-sm" title="一键清理浏览器缓存并获取最新版本" onclick="window.clearAppCacheAndReload()">
            🧹 更新
          </button>
          <button id="header-export-btn" class="btn btn-secondary btn-sm" title="一键导出全部数据备份">
            💾 导出
          </button>
          <button id="header-import-btn" class="btn btn-secondary btn-sm" title="导入数据备份">
            📂 导入
          </button>
        </div>
      </div>
    </header>

    <!-- 单面板容器区（仅激活面板显示） -->
    <div class="panels-container">
      <section class="panel active" id="task-panel"></section>
      <section class="panel" id="journal-panel"></section>
      <section class="panel" id="reading-panel"></section>
      <section class="panel" id="research-panel"></section>
      <section class="panel" id="file-panel"></section>
      <section class="panel" id="settings-panel"></section>
    </div>
  </main>
</div>

<!-- 全局导入文件选择器 -->
<input id="global-backup-file-input" type="file" accept="application/json" style="display:none" />

<script type="module" src="main.js?v=1.3.4"></script>
</body>
</html>
